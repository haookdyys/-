name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Extract source
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          GRADLEW=$(find source -type f -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/app"
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "没有找到 APK"
            exit 1
          fi
          cp "$APK" output/SmsForwarder-V56.1.apk
          echo "APK：$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-V56.1-APK
          path: output/SmsForwarder-V56.1.apk
