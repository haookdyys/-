name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.0.2'

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 没有找到源码 ZIP"
            exit 1
          fi

          echo "找到源码：$ZIP_FILE"

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          GRADLEW=$(find source -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: 源码 ZIP 中没有找到 gradlew"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android 项目目录：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix old build configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          # 这个老插件在项目中没有实际使用，移除它避免构建时下载失败
          sed -i "/com\.chenenyu:img-optimizer/d" build.gradle

          # 增加 Maven Central
          sed -i "/repositories {/a\        mavenCentral()" build.gradle

          # 创建 debug 签名文件
          mkdir -p app

          keytool -genkeypair \
            -v \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: 编译完成但没有找到 APK"
            exit 1
          fi

          echo "找到 APK：$APK"

          cp "$APK" output/SmsForwarder-V56.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-V56.1-APK
          path: output/SmsForwarder-V56.1.apk
